# push 時に Ruby の静的解析を実行する CI ワークフロー
name: Rails CI

# このワークフローが実行されるトリガー
on:
  push:
    branches-ignore:
      - main

jobs:
  # バックエンドのテストジョブ
  app-tests:
    # 実行環境をUbuntuの最新版に設定
    runs-on: ubuntu-latest

    # 実行するステップ
    steps:
      - uses: actions/checkout@v4 # リポジトリのチェックアウト

      # Rubyのセットアップ
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.0"
          bundler-cache: true

      # Rubocopでコードの静的解析
      - name: Run RuboCop
        run: bundle exec rubocop
